# Cutthroat Carnivore "Voltage" noteskin (@VARIANT@) - original art and code by Cutthroat Carnivore.
[Global]
FallbackNoteSkin=common

[NoteDisplay]
# Notes are coloured by rhythm (4th, 8th, 12th, 16th, 24th, 32nd, 48th, 64th, 192nd)
# and animate on the beat: 4 frames per beat, all notes in sync,
# so the lightning in every arrow strikes on the beat.
AnimationIsBeatBased=1
TapNoteAnimationLength=1
TapLiftAnimationLength=1
TapFakeAnimationLength=1
TapMineAnimationLength=1
HoldHeadAnimationLength=1
RollHeadAnimationLength=1
HoldBodyAnimationLength=1
RollBodyAnimationLength=1
HoldBottomCapAnimationLength=1
RollBottomCapAnimationLength=1
HoldTopCapAnimationLength=1
RollTopCapAnimationLength=1
HoldBodyAnimationIsVivid=0
RollBodyAnimationIsVivid=0
TapNoteAnimationIsVivid=0
TapLiftAnimationIsVivid=0
TapFakeAnimationIsVivid=0
HoldHeadAnimationIsVivid=0
RollHeadAnimationIsVivid=0

TapNoteNoteColorType=Denominator
TapNoteNoteColorCount=9
TapNoteNoteColorTextureCoordSpacingX=0
TapNoteNoteColorTextureCoordSpacingY=0.0625
TapFakeNoteColorType=Denominator
TapFakeNoteColorCount=9
TapFakeNoteColorTextureCoordSpacingX=0
TapFakeNoteColorTextureCoordSpacingY=0.0625
TapLiftNoteColorType=Denominator
TapLiftNoteColorCount=9
TapLiftNoteColorTextureCoordSpacingX=0
TapLiftNoteColorTextureCoordSpacingY=0.0625
HoldHeadNoteColorType=Denominator
HoldHeadNoteColorCount=9
HoldHeadNoteColorTextureCoordSpacingX=0
HoldHeadNoteColorTextureCoordSpacingY=0.0625
RollHeadNoteColorType=Denominator
RollHeadNoteColorCount=9
RollHeadNoteColorTextureCoordSpacingX=0
RollHeadNoteColorTextureCoordSpacingY=0.0625

DrawHoldHeadForTapsOnSameRow=0
DrawRollHeadForTapsOnSameRow=0
TapHoldRollOnRowMeansHold=1
HoldHeadIsAboveWavyParts=1
HoldTailIsAboveWavyParts=1
StartDrawingHoldBodyOffsetFromHead=0
StopDrawingHoldBodyOffsetFromTail=0
HoldLetGoGrayPercent=0.35
ReverseDrawOrder=1101
FlipHeadAndTailWhenReverse=1
FlipHoldBodyWhenReverse=1
TopHoldAnchorWhenReverse=1
